[project]
name = "rag-grounded-chatbot"
version = "0.1.0"
description = "RAG + Citation Grounding — answers with receipts"
requires-python = ">=3.10"
authors = [{ name = "You" }]
dependencies = [
    "gradio>=4.0,<5.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "llama-index>=0.10",
    "llama-index-embeddings-huggingface>=0.1",
    "llama-index-llms-ollama>=0.1",
    "llama-index-vector-stores-chroma>=0.1",
    "llama-index-readers-file>=0.1",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "pymupdf>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
ocr = ["pytesseract>=0.3"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100